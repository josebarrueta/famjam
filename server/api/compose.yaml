services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: famjam
      POSTGRES_PASSWORD: famjam
      POSTGRES_DB: famjam
    ports:
      - "5432:5432"
    volumes:
      - famjam-postgres:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U famjam"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://famjam:famjam@postgres:5432/famjam
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  famjam-postgres:
