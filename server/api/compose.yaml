services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: famjam
      POSTGRES_PASSWORD: famjam
      POSTGRES_DB: famjam
    ports:
      - "5432:5432"
    volumes:
      - famjam-postgres:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U famjam"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.10.1-alpine
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - famjam-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://famjam:famjam@postgres:5432/famjam
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  famjam-postgres:
  famjam-redis:
