services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: rallyroo
      POSTGRES_PASSWORD: rallyroo
      POSTGRES_DB: rallyroo
    ports:
      - "5432:5432"
    volumes:
      - rallyroo-postgres:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rallyroo"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.10.1-alpine
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - rallyroo-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    command: ["/app/scripts/migrate.sh"]
    environment:
      DATABASE_URL: postgres://rallyroo:rallyroo@postgres:5432/rallyroo
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://rallyroo:rallyroo@postgres:5432/rallyroo
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/ready').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  rallyroo-postgres:
  rallyroo-redis:
