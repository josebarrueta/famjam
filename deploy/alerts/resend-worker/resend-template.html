<!doctype html>
<html lang="en">
  <body style="margin:0;background:#f7f4ff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#241b35">
    <div style="max-width:640px;margin:0 auto;padding:32px 20px">
      <div style="background:#ffffff;border:1px solid #e8def8;border-radius:18px;padding:28px">
        <p style="margin:0 0 8px;color:#7a4cc2;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase">Rallyroo deployment alert</p>
        <h1 style="margin:0 0 22px;font-size:25px">{{{REASON}}}</h1>
        <p style="line-height:1.6">{{{MESSAGE}}}</p>
        <table style="width:100%;border-collapse:collapse;margin-top:24px;font-size:14px">
          <tr><td style="padding:7px 0;color:#6d6378">Application</td><td style="padding:7px 0;text-align:right">{{{APPLICATION}}}</td></tr>
          <tr><td style="padding:7px 0;color:#6d6378">Environment</td><td style="padding:7px 0;text-align:right">{{{ENVIRONMENT}}}</td></tr>
          <tr><td style="padding:7px 0;color:#6d6378">Object</td><td style="padding:7px 0;text-align:right">{{{OBJECT}}}</td></tr>
          <tr><td style="padding:7px 0;color:#6d6378">Namespace</td><td style="padding:7px 0;text-align:right">{{{NAMESPACE}}}</td></tr>
          <tr><td style="padding:7px 0;color:#6d6378">Revision</td><td style="padding:7px 0;text-align:right">{{{REVISION}}}</td></tr>
          <tr><td style="padding:7px 0;color:#6d6378">Time</td><td style="padding:7px 0;text-align:right">{{{TIMESTAMP}}}</td></tr>
        </table>
      </div>
    </div>
  </body>
</html>
