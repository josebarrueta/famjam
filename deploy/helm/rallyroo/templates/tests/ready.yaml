apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-test-ready
  labels:
    {{- include "rallyroo.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: ready
      image: {{ .Values.tests.image }}
      command:
        - /bin/sh
        - -ec
        - >-
          wget -qO- http://{{ .Release.Name }}-api:3000/ready |
          grep -q '"status":"ready"'
