{{- if .Values.migrations.preUpgrade.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate
  labels:
    {{- include "rallyroo.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration-pre
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrations.preUpgrade.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrations.preUpgrade.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "rallyroo.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration-pre
    spec:
      restartPolicy: Never
      {{- if .Values.postgres.credentialsSecret }}
      securityContext:
        fsGroup: 1000
      {{- end }}
      containers:
        - name: migrate
          image: "{{ .Values.api.image.repository }}:{{ include "rallyroo.apiImageTag" . }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          command: ["/app/scripts/migrate.sh"]
          args: ["pre"]
          {{- if not .Values.postgres.credentialsSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.runtimeSecret }}
          {{- end }}
          env:
            - name: APPLICATION_VERSION
              value: {{ include "rallyroo.apiImageTag" . | quote }}
            {{- if .Values.postgres.credentialsSecret }}
            {{- include "rallyroo.postgresConnectionEnv" . | nindent 12 }}
          volumeMounts:
            {{- include "rallyroo.postgresPasswordVolumeMount" . | nindent 12 }}
            {{- else }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.runtimeSecret }}
                  key: DATABASE_URL
            {{- end }}
      {{- if .Values.postgres.credentialsSecret }}
      volumes:
        {{- include "rallyroo.postgresPasswordVolume" . | nindent 8 }}
      {{- end }}
{{- end }}
{{- if .Values.migrations.postUpgrade.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate-post
  labels:
    {{- include "rallyroo.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration-post
  annotations:
    "helm.sh/hook": post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrations.postUpgrade.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrations.postUpgrade.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "rallyroo.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration-post
    spec:
      serviceAccountName: {{ .Release.Name }}-migration
      restartPolicy: Never
      {{- if .Values.postgres.credentialsSecret }}
      securityContext:
        fsGroup: 1000
      {{- end }}
      initContainers:
        - name: wait-for-api-rollout
          image: {{ .Values.migrations.postUpgrade.rolloutWaitImage }}
          command: ["kubectl"]
          args:
            - rollout
            - status
            - deployment/{{ .Release.Name }}-api
            - --timeout={{ .Values.migrations.postUpgrade.activeDeadlineSeconds }}s
      containers:
        - name: migrate
          image: "{{ .Values.api.image.repository }}:{{ include "rallyroo.apiImageTag" . }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          command: ["/app/scripts/migrate.sh"]
          args: ["post"]
          {{- if not .Values.postgres.credentialsSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.runtimeSecret }}
          {{- end }}
          env:
            - name: APPLICATION_VERSION
              value: {{ include "rallyroo.apiImageTag" . | quote }}
            {{- if .Values.postgres.credentialsSecret }}
            {{- include "rallyroo.postgresConnectionEnv" . | nindent 12 }}
          volumeMounts:
            {{- include "rallyroo.postgresPasswordVolumeMount" . | nindent 12 }}
            {{- else }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.runtimeSecret }}
                  key: DATABASE_URL
            {{- end }}
      {{- if .Values.postgres.credentialsSecret }}
      volumes:
        {{- include "rallyroo.postgresPasswordVolume" . | nindent 8 }}
      {{- end }}
{{- end }}
