apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rallyroo
  namespace: rallyroo
spec:
  releaseName: rallyroo
  targetNamespace: rallyroo
  storageNamespace: rallyroo
  serviceAccountName: rallyroo-reconciler
  chartRef:
    kind: OCIRepository
    name: rallyroo-chart
  interval: 10m
  timeout: 5m
  maxHistory: 5
  driftDetection:
    mode: enabled
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
      remediateLastFailure: true
  rollback:
    cleanupOnFail: true
  test:
    enable: true
    ignoreFailures: false
  values:
    runtimeConfig:
      enabled: true
      apns:
        teamID: 5LS29Z8553
        bundleID: dev.rallyroo.app
        environment: production
    postgres:
      credentialsSecret: rallyroo-postgres
      persistence:
        mode: hostPath
        hostPath: /var/local/rallyroo/postgres
    redis:
      persistence:
        mode: hostPath
        hostPath: /var/local/rallyroo/redis
    nginx:
      service:
        type: NodePort
        nodePort: 30080
