apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rallyroo
  namespace: rallyroo
spec:
  releaseName: rallyroo
  targetNamespace: rallyroo
  storageNamespace: rallyroo
  serviceAccountName: rallyroo-reconciler
  chartRef:
    kind: OCIRepository
    name: rallyroo-chart
  interval: 10m
  timeout: 5m
  maxHistory: 5
  driftDetection:
    mode: enabled
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
      remediateLastFailure: true
  rollback:
    cleanupOnFail: true
  test:
    enable: true
    ignoreFailures: false
  values:
    providerSecrets:
      stytch: rallyroo-stytch
      calendarEncryption: rallyroo-calendar-encryption
    runtimeConfig:
      enabled: true
      stytch:
        projectID: project-live-9211da89-0aa2-4ee9-a661-ebc8d68ae4b5
        publicToken: public-token-live-7ce8cefc-8580-4e62-a385-035e81e9918d
        oauthCallbackURL: rallyroo://oauth-callback
        environment: live
        customBaseURL: https://login.rallyroo.dev
      apns:
        teamID: 5LS29Z8553
        bundleID: dev.rallyroo.app
        environment: production
    postgres:
      credentialsSecret: rallyroo-postgres
      persistence:
        mode: hostPath
        hostPath: /var/local/rallyroo/postgres
    redis:
      persistence:
        mode: hostPath
        hostPath: /var/local/rallyroo/redis
    nginx:
      service:
        type: NodePort
        nodePort: 30080
