name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version to publish (for example, 1.2.3 or 1.2.3-rc.1)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: josebarrueta/rallyroo-api
  CHART_REGISTRY: oci://ghcr.io/josebarrueta/charts

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
      stable: ${{ steps.version.outputs.stable }}
    steps:
      - name: Resolve release version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            raw_version="$REQUESTED_VERSION"
          else
            raw_version="$GITHUB_REF_NAME"
          fi
          version="${raw_version#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Version must be SemVer without build metadata: $raw_version" >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" && "$raw_version" != "v$version" ]]; then
            echo "Release tags must start with v" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "stable=false" >> "$GITHUB_OUTPUT"
          else
            echo "stable=true" >> "$GITHUB_OUTPUT"
          fi

  verify:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v5
      - run: ./deploy/helm/rallyroo/test-chart-contract.sh
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/api/package-lock.json
      - name: Verify API
        working-directory: server/api
        run: |
          npm ci
          npm run test:unit
          npm run typecheck
          npm run build

  build-image:
    needs: [prepare, verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            suffix: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build native ${{ matrix.platform }} image
        uses: docker/build-push-action@v7
        with:
          context: server/api
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:build-${{ needs.prepare.outputs.sha }}-${{ matrix.suffix }}
          labels: |
            org.opencontainers.image.title=Rallyroo API
            org.opencontainers.image.description=Rallyroo family scheduler API
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=release-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.suffix }}

  publish:
    needs: [prepare, build-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture image manifest
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA_VERSION: ${{ needs.prepare.outputs.sha }}
          STABLE: ${{ needs.prepare.outputs.stable }}
        run: |
          image="$REGISTRY/$IMAGE_NAME"
          tags=(--tag "$image:$VERSION" --tag "$image:sha-$SHA_VERSION")
          if [[ "$STABLE" == "true" ]]; then
            tags+=(--tag "$image:latest")
          fi
          docker buildx imagetools create "${tags[@]}" \
            "$image:build-$SHA_VERSION-amd64" \
            "$image:build-$SHA_VERSION-arm64"
          docker buildx imagetools inspect "$image:$VERSION"

      - uses: azure/setup-helm@v5
      - name: Package Helm chart
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p dist
          helm package deploy/helm/rallyroo \
            --destination dist \
            --version "$VERSION" \
            --app-version "$VERSION"
          helm show chart "dist/rallyroo-$VERSION.tgz"

      # The chart is the deployment promotion signal and is deliberately
      # published only after every image architecture is available.
      - name: Publish Helm chart last
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          echo "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "dist/rallyroo-$VERSION.tgz" "$CHART_REGISTRY"

      - uses: actions/upload-artifact@v6
        with:
          name: rallyroo-helm-${{ needs.prepare.outputs.version }}
          path: dist/rallyroo-${{ needs.prepare.outputs.version }}.tgz
          if-no-files-found: error
