name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version to publish (for example, 1.2.3 or 1.2.3-rc.1)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: josebarrueta/rallyroo-api
  CHART_REGISTRY: oci://ghcr.io/josebarrueta/charts

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve release version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            raw_version="$REQUESTED_VERSION"
          else
            raw_version="$GITHUB_REF_NAME"
          fi
          version="${raw_version#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Version must be SemVer without build metadata: $raw_version" >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" && "$raw_version" != "v$version" ]]; then
            echo "Release tags must start with v" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "stable=false" >> "$GITHUB_OUTPUT"
          else
            echo "stable=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate Helm chart
        uses: azure/setup-helm@v5

      - run: helm lint deploy/helm/rallyroo

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/api/package-lock.json

      - name: Verify API
        working-directory: server/api
        run: |
          npm ci
          npm run test:unit
          npm run typecheck
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=sha-${{ steps.version.outputs.sha }}
            type=raw,value=latest,enable=${{ steps.version.outputs.stable == 'true' }}
          labels: |
            org.opencontainers.image.title=Rallyroo API
            org.opencontainers.image.description=Rallyroo family scheduler API
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Build and publish API image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: server/api
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Package Helm chart
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          helm package deploy/helm/rallyroo \
            --destination dist \
            --version "$VERSION" \
            --app-version "$VERSION"
          helm show chart "dist/rallyroo-$VERSION.tgz"

      - name: Log Helm in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Publish Helm chart
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: helm push "dist/rallyroo-$VERSION.tgz" "$CHART_REGISTRY"

      - name: Upload packaged chart
        uses: actions/upload-artifact@v5
        with:
          name: rallyroo-helm-${{ steps.version.outputs.version }}
          path: dist/rallyroo-${{ steps.version.outputs.version }}.tgz
          if-no-files-found: error
