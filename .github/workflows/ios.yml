name: iOS

on:
  pull_request:
    paths:
      - "clients/ios/**"
      - ".github/workflows/ios.yml"
  push:
    branches: [main]
    paths:
      - "clients/ios/**"
      - ".github/workflows/ios.yml"

jobs:
  test:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: clients/ios
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test core
        run: swift test
      - name: Build iOS app
        run: >-
          xcodebuild -project FamilyApp.xcodeproj -target FamilyApp
          -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build
